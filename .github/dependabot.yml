# Dependabot config: scheduled dep updates across all three of our
# dependency ecosystems. PRs land on Monday mornings so weekly review
# is predictable; max 5 open PRs per ecosystem to avoid swamping
# review capacity on a low-traffic repo.
#
# Security updates (separate from version updates configured here)
# are also enabled at the repo level — those fire immediately when
# GHSA publishes a new advisory affecting a pinned dep, regardless
# of this schedule.

version: 2
updates:
  # Go modules — the plugin server. Includes transitive deps so the
  # full security surface is tracked.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "deps(go)"
      include: scope
    groups:
      # Group minor + patch bumps into one PR per ecosystem so review
      # noise stays low. Majors stay separate (breaking changes).
      go-minor-patch:
        update-types:
          - minor
          - patch
      # Group ALL security fixes into one PR per Dependabot run. Without
      # this, security updates default to one-PR-per-advisory, and when
      # two advisories land close together (e.g. grpc + x/text) neither
      # PR can pass the required `SBOM + Grype --fail-on high` gate alone
      # — each still carries the other's unpatched HIGH — deadlocking a
      # strict, enforce_admins-protected main. Grouping lets a single PR
      # clear the gate. applies-to:security-updates is required — a group
      # with no applies-to only covers version updates.
      security-all:
        applies-to: security-updates
        patterns:
          - '*'

  # build/ sub-modules each have their own go.mod (manifest, pluginctl,
  # render-docs). Cover them too so the build tooling stays current.
  # These aren't SBOM-scanned, so no gate deadlock — but group their
  # security fixes for the same low-noise, consistency reasons.
  - package-ecosystem: gomod
    directory: /build/manifest
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - build-tooling
    commit-message:
      prefix: "deps(build/manifest)"
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /build/pluginctl
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - build-tooling
    commit-message:
      prefix: "deps(build/pluginctl)"
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /build/render-docs
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - build-tooling
    commit-message:
      prefix: "deps(build/render-docs)"
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - '*'

  # GitHub Actions used by .github/workflows/*.yml. Keeps action SHAs
  # current — important because we pin all actions to SHAs (security),
  # which means we don't get automatic updates the way @v4 tag users do.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
