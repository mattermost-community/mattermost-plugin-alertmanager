# Runs the SBOM + Grype scan and CodeQL static analysis on every PR
# and every push to main. Uploads SARIF results to GitHub code scanning
# so findings show up inline on PRs and in the Security tab.
#
# Gating model:
#   - Grype: does NOT hard-fail the job (fail-build: false). Generates and uploads
#     SARIF so every CVE stays visible in the Security tab and inline on PRs.
#   - CodeQL / security-gate:
#       * main branch + scheduled runs: hard-fail on error-level SARIF findings.
#         A finding that reaches main blocks the next release cut.
#       * PR / branch push: continue-on-error — the gate runs and its result is
#         visible (warning annotation), but the job stays green. Findings still
#         land in the Security tab via the SARIF upload. Fix NEW findings before
#         merge; standing reviewed findings (e.g. GO-2026-5932) must NOT be
#         suppressed or ignored — they have an open review tracking them.
#   - SARIF upload to Code Scanning: required on all triggers, no bypass.
#     (Requires Code Scanning enabled: public repos free, private needs GHAS.)
#
# NOTE (security posture): Standing finding GO-2026-5932 is intentionally open
# pending security review — do NOT suppress, dismiss, or add an ignore rule.
# A fixable HIGH should be fixed via a dependency bump before merging, not
# left to warn. Check `grype sbom:dist/sbom/server-sbom.json` for a patched
# version before treating a finding as unactionable.
#
# REQUIREMENT: GitHub Code Scanning must be enabled on the repo.
#   - Public repos: free, enable via Settings -> Code security and analysis
#   - Private repos: requires GitHub Advanced Security (paid, Enterprise plan)
# Without it, the SARIF upload step will fail and the workflow will go red.
# That is intentional — security findings must reach the Security tab so
# reviewers can see them inline on the PR.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-run weekly to catch newly-disclosed CVEs even when no code changes.
    # GHSA / NVD update continuously; we'd otherwise only notice on the
    # next PR, which may be weeks away for a stable plugin.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write  # upload SARIF to code scanning
  actions: read

jobs:
  sbom-scan:
    name: SBOM + Grype vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate SBOM
        run: make sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/sbom/
          retention-days: 30

      # Run Grype directly (rather than via make) so we can emit SARIF
      # for GitHub code scanning. `make sbom-scan` emits table output
      # only — useful for humans, not for the code scanning API.
      - name: Scan SBOM with Grype (SARIF output)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v6.7.0
        id: grype-scan
        with:
          sbom: dist/sbom/server-sbom.json
          # Warn, don't hard-fail: the SARIF is still produced and uploaded below,
          # so Code Scanning's PR check gates on NEW alerts while the standing
          # (intentionally-open, unsuppressable) GO-2026-5932 doesn't block every
          # PR. See the gating-model note in this file's header. severity-cutoff
          # still scopes what Grype reports as findings (high/critical).
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      # Grype's SBOM-mode SARIF emits results whose artifactLocation.uri is
      # an EMPTY string (""). GitHub Code Scanning rejects the upload with
      # "locationFromSarifResult: expected artifact location". Anchor each
      # finding to go.sum — the committed source of these go-module CVEs —
      # so the SARIF is accepted and findings render in the Security tab.
      # (jq is preinstalled on GitHub-hosted ubuntu runners.)
      - name: Anchor Grype SARIF findings (Code Scanning requires a location)
        if: always() && steps.grype-scan.outputs.sarif != ''
        run: |
          f="${{ steps.grype-scan.outputs.sarif }}"
          jq '(.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation.uri) |= (if (. == "" or . == null) then "go.sum" else . end)' "$f" > "$f.fixed"
          mv "$f.fixed" "$f"

      # Upload is required, not best-effort. If Code Scanning isn't
      # enabled on this repo, the step fails and the workflow goes red
      # — by design. Enable Code Scanning in repo settings (public:
      # free; private: needs GHAS).
      - name: Upload Grype SARIF to code scanning
        if: always() && steps.grype-scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.30.0
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: grype

      - name: Upload Grype SARIF as workflow artifact
        if: always() && steps.grype-scan.outputs.sarif != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-sarif
          path: ${{ steps.grype-scan.outputs.sarif }}
          retention-days: 30

  codeql:
    name: CodeQL static analysis (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.30.0
        with:
          languages: go
          # Index from repo root so root-package files (main.go,
          # docs_embed.go, runbooks_embed.go) are covered. The Go
          # module is rooted at the repo root — server/ is just a
          # package inside it, not a separate module.

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.30.0

      # Split analysis from upload so each step's success/failure has
      # one clear meaning. `upload: never` writes SARIF locally; the
      # explicit security-gate step then enforces the finding threshold,
      # and the upload step pushes results to GitHub Code Scanning.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.30.0
        id: codeql-analyze
        with:
          category: codeql-go
          upload: never
          output: codeql-results

      # Stage the SARIF where `make security-gate` looks for it
      # (dist/codeql-*.sarif). The Make target parses the SARIF
      # for level=error findings and fails CI if any are present.
      # Same gate as `make release` runs locally.
      #
      # Gating model (branch vs main):
      #   - main / schedule: hard-fail — a finding that merges to main
      #     must be resolved before the next release cut.
      #   - PR / branch push: continue-on-error — findings are still
      #     visible in the Security tab and inline on the PR via the
      #     SARIF upload below, but the job itself stays green so a
      #     standing finding (e.g. GO-2026-5932) doesn't block every PR.
      #     Fix NEW findings before merge; standing ones have a tracked
      #     review open and must NOT be suppressed or ignored.
      - name: Run security gate (fail on main, warn on branches/PRs)
        run: |
          mkdir -p dist
          cp codeql-results/*.sarif dist/codeql-go.sarif
          make security-gate
        continue-on-error: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

      # Required: must reach the Security tab. No continue-on-error.
      # If this fails, enable Code Scanning per the workflow header.
      - name: Upload CodeQL SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.30.0
        with:
          sarif_file: codeql-results
          category: codeql-go

      - name: Upload CodeQL SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30
