# Runs `go test ./...` on every push to main and every pull request.
# Acts as the primary regression gate — any contributor change that
# breaks the configuration parser, the AM-URL dedup logic, or any of
# the runbook/template helpers will fail this check before merge.
#
# Go version is pinned to the toolchain declared in go.mod. setup-go
# honors the go-version-file field, so a future Go bump in go.mod
# propagates to CI automatically without editing this workflow.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 ./...

  # Validates the generated Prometheus Operator CRD output (--format=crd)
  # against the real AlertmanagerConfig v1alpha1 schema via kubeconform. The
  # renderer emits CRDs at runtime, so TestCRDManifestKubeconform generates a
  # sample and validates it here — catching operator schema/field drift the
  # structure-only YAML round-trip tests can't. The schema is VENDORED at
  # build/crd-schemas/ (not fetched at run time), so this job runs offline —
  # required for air-gapped/closed CI. kubeconform is installed via the Go
  # toolchain already set up, pinned to a released version.
  validate-crd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: Validate generated AlertmanagerConfig against operator schema
        run: go test -run TestCRDManifestKubeconform -count=1 -v ./server/...

  # Validates the shipped sample rules (samples/prometheus-rules.yaml) with
  # promtool. Users copy this file into their own Prometheus, so a broken
  # PromQL expr or malformed YAML must never merge. promtool ships inside the
  # prom/prometheus image (its entrypoint is /bin/prometheus, hence the
  # --entrypoint override); the tag is pinned to match the version the
  # deploy-local verify-rules.sh gate uses.
  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/samples":/w -w /w \
            prom/prometheus:v3.5.0 \
            check rules /w/prometheus-rules.yaml
